      docker:
        dockerfile: dockerfile

    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/template
      context: sandbox/template
      docker:
        dockerfile: dockerfile

    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/router
      context: sandbox/router
      docker:
        dockerfile: dockerfile



    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/notification
      context: notification
      docker:
        dockerfile: dockerfile


    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/sync-agent
      context: sandbox/sync-agent
      docker:
        dockerfile: dockerfile



manifests:
