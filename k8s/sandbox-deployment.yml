apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox
  labels:
    name:  sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-server
  template:
    metadata:
      labels:
        app: sandbox-server
    spec:
      serviceAccountName: resource-manager
      containers:
      - image:  980195619982.dkr.ecr.ap-south-1.amazonaws.com/sandbox
        name:  main-sandbox-container
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "500m"
            memory: "400Mi"
          requests:
            cpu: "250m"
            memory: "200Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10   
        ports:
        - containerPort:  3000
          name:  main-sandbox
        env:
          - name: REDIS_URL 
            valueFrom: 
              secretKeyRef: 
                name: database
                key: REDIS_URL

          - name: SANDBOX_MONGO_URI 
            valueFrom:
              secretKeyRef:
                name: database
                key: SANDBOX_MONGO_URI

          - name: JWT
            valueFrom:
              secretKeyRef:
                name: jwt
                key: JWT

          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_ACCESS_KEY_ID

          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_SECRET_ACCESS_KEY

          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_REGION

      