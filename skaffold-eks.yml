apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}

  platforms:
    - linux/amd64  

  artifacts:
    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile



    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/auth
      context: auth
      docker:
        dockerfile: dockerfile
  

    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile

    - image: 980195619982.dkr.ecr.ap-south-1.amazonaws.com/sandbox
